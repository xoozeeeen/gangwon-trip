<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>영민수동의 강원도 여행</title>
<meta name="theme-color" content="#3D332B">

<!--
  ============================================================
  📌 이 파일 하나로 완성된 웹페이지입니다 (서버 필요 없음)
  ============================================================
  - 사용법: 이 파일을 더블클릭하면 바로 브라우저에서 열립니다.
  - 공유법: 카카오톡/문자로 이 파일을 그대로 보내드리거나,
            구글 드라이브 등에 올린 뒤 링크를 공유하면 됩니다.
  - 이미지가 파일 안에 통째로 들어있어서(이미지 파일을 따로
    첨부하지 않아도) 이 html 파일 하나만 보내면 그림까지 그대로 보여요.
  - 수정법: 아래로 내려서 "여기만 고치면 돼요!!" 라고 적힌
            부분(제목, 일정 내용)만 바꾸면 됩니다.
  ============================================================
-->

<!-- 본문용 한글 폰트 (가독성 우선) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- 픽셀 느낌 한글 폰트 (Galmuri) - 제목/버튼 등 포인트에만 사용 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css">

<style>
  /* ============================================================
     🎨 색상 & 기본 설정 (민트 · 브라운 · 화이트 / 픽셀 아트 톤)
     ============================================================ */
  :root{
    --mint:#CAFDEC;        /* 메인 민트 */
    --mint-light:#EBFEFB;  /* 아주 연한 민트 (배경) */
    --brown:#3D332B;       /* 포인트 브라운 (강조/글자/테두리) */
    --white:#FFFFFF;

    --pixel-notch:8px; /* 픽셀 느낌 계단식 모서리 크기 */
    --shadow-hard:6px 6px 0 var(--brown);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--mint-light);
    color:var(--brown);
    font-family:'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size:18px;       /* 부모님이 읽기 편한 기본 글자 크기 */
    line-height:1.6;
    -webkit-tap-highlight-color:transparent;
  }

  /* 픽셀 포인트 폰트: 제목/라벨/버튼에만 '절제해서' 사용 (본문은 가독성 위해 Noto 유지) */
  .pixel-font{
    font-family:'Galmuri11','Galmuri9','Noto Sans KR',monospace;
    letter-spacing:0.02em;
  }

  img{ max-width:100%; display:block; }

  /* 픽셀 게임 UI 느낌의 계단식 모서리 */
  .pixel-corners{
    clip-path: polygon(
      var(--pixel-notch) 0, calc(100% - var(--pixel-notch)) 0,
      100% var(--pixel-notch), 100% calc(100% - var(--pixel-notch)),
      calc(100% - var(--pixel-notch)) 100%, var(--pixel-notch) 100%,
      0 calc(100% - var(--pixel-notch)), 0 var(--pixel-notch)
    );
  }

  /* ============================================================
     1. 히어로(첫 화면) 섹션 — 산/들판 이미지 + 제목
     ============================================================ */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    padding:32px 20px;
  }

  .hero-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 65%;
    z-index:0;
  }

  .hero-overlay{
    position:absolute;
    inset:0;
    z-index:1;
    background:linear-gradient(180deg, rgba(235,254,251,0.15) 0%, rgba(235,254,251,0.55) 55%, rgba(202,253,236,0.85) 100%);
  }

  .hero-content{
    position:relative;
    z-index:2;
    max-width:640px;
  }

  .hero-badge{
    display:inline-block;
    background:var(--white);
    color:var(--brown);
    font-weight:700;
    font-size:0.9rem;
    padding:9px 16px;
    box-shadow:var(--shadow-hard);
    border:3px solid var(--brown);
    margin-bottom:26px;
  }

  .hero-title{
    font-size:clamp(1.9rem, 8.5vw, 3rem);
    color:var(--brown);
    margin:0 0 16px 0;
    line-height:1.45;
    text-shadow:2px 2px 0 rgba(255,255,255,0.8);
  }

  .hero-subtitle{
    font-size:clamp(1.1rem, 4.2vw, 1.4rem);
    font-weight:700;
    color:var(--brown);
    margin:0;
    background:var(--white);
    display:inline-block;
    padding:6px 16px;
    border:2px solid var(--brown);
  }

  .scroll-cue{
    position:relative;
    z-index:2;
    margin-top:44px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    color:var(--brown);
    font-weight:700;
    font-size:0.9rem;
  }

  .scroll-cue svg{ animation:bounce 1.8s ease-in-out infinite; }

  @keyframes bounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(10px); }
  }

  /* 작은 반짝임 장식 (아주 은은하게, 몇 개만) */
  .sparkle{
    position:absolute;
    z-index:2;
    animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.35; }
    50%{ opacity:1; }
  }

  /* ============================================================
     2. 일정(DAY) 섹션
     ============================================================ */
  .schedule{
    max-width:640px;
    margin:0 auto;
    padding:44px 16px 10px;
  }

  .day-card{
    background:var(--white);
    border:3px solid var(--brown);
    margin-bottom:44px;
    overflow:hidden;
    opacity:0;
    transform:translateY(16px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .day-card.is-visible{ opacity:1; transform:translateY(0); }

  .day-header{
    background:var(--brown);
    color:var(--mint-light);
    padding:20px 22px;
    border-bottom:3px solid var(--brown);
  }

  .day-header .day-num{
    font-size:clamp(1.5rem, 5.5vw, 1.9rem);
    margin:0;
    color:var(--mint);
  }

  .day-header .day-date{
    margin:6px 0 0;
    font-size:1rem;
    font-weight:500;
    color:var(--mint-light);
    opacity:0.9;
    font-family:'Noto Sans KR',sans-serif;
  }

  .place-list{
    padding:18px 18px 22px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .place{
    padding-bottom:18px;
    border-bottom:2px dashed var(--mint);
  }
  .place:last-child{ border-bottom:none; padding-bottom:0; }

  .place-time{
    display:inline-block;
    background:var(--brown);
    color:var(--mint);
    font-weight:700;
    font-size:0.9rem;
    padding:5px 12px;
    margin-bottom:10px;
  }

  /* 장소 이름 전체가 눌리는 버튼 — 네이버지도로 새 창 이동 */
  .place-name-link{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    background:var(--mint);
    border:2.5px solid var(--brown);
    padding:14px 16px;
    text-decoration:none;
    color:var(--brown);
    min-height:48px;
    transition:transform .1s ease, background .1s ease;
  }
  .place-name-link:active{
    transform:scale(0.98);
    background:var(--mint-light);
  }

  /* 지도 링크가 없는 일정은 버튼처럼 보이되 눌리지 않게 표시 */
  .place-name-static{
    display:flex;
    align-items:center;
    background:var(--mint-light);
    border:2.5px solid var(--brown);
    padding:14px 16px;
    color:var(--brown);
    min-height:48px;
  }

  .place-name-text{
    font-weight:700;
    font-size:1.12rem;
    line-height:1.4;
    font-family:'Noto Sans KR',sans-serif; /* 장소명은 가독성을 위해 일반 서체 사용 */
  }

  .place-name-hint{
    flex-shrink:0;
    font-size:0.78rem;
    color:var(--brown);
    white-space:nowrap;
    opacity:0.75;
  }

  .place-desc{
    margin:12px 2px 0;
    color:var(--brown);
    opacity:0.85;
    font-size:1.02rem;
    line-height:1.65;
  }

  /* ============================================================
     3. 하단 마무리 문구
     ============================================================ */
  .footer{
    text-align:center;
    padding:56px 20px 64px;
    background:var(--brown);
  }

  .footer p{
    font-size:clamp(1.2rem, 4.6vw, 1.5rem);
    color:var(--mint);
    margin:0;
    line-height:1.6;
  }

  .footer span{
    display:block;
    margin-top:10px;
    font-size:0.95rem;
    font-weight:500;
    color:var(--mint-light);
    opacity:0.75;
    font-family:'Noto Sans KR',sans-serif;
  }

  @media (min-width:700px){
    body{ font-size:19px; }
  }

  @media (prefers-reduced-motion: reduce){
    .scroll-cue svg, .day-card, .sparkle{ animation:none !important; transition:none !important; }
    .day-card{ opacity:1; transform:none; }
  }
</style>
</head>

const CONFIG = {
  heroTitle: "영민수동의<br>강원도 여행",
  heroSubtitle: "우리 가족, 강원도로 떠나요!",
  footerText: "즐겁고 안전하게 다녀옵시다 ❤️"
};


/* ================================================================
   ⚙️ 아래부터는 화면을 자동으로 그려주는 코드입니다.
      (이 아래는 건드리지 않아도 정상 작동합니다)
   ================================================================ */
document.getElementById('heroTitle').innerHTML = CONFIG.heroTitle;
document.getElementById('heroSubtitle').textContent = CONFIG.heroSubtitle;
document.getElementById('footerText').textContent = CONFIG.footerText;

const container = document.getElementById('scheduleContainer');

const html = tripData.map(day => `
  <section class="day-card">
    <div class="day-header">
      <h2 class="day-num pixel-font">DAY ${day.day}</h2>
      <p class="day-date">${day.dateLabel}</p>
    </div>
    <div class="place-list">
      ${day.places.map(place => `
        <div class="place">
          <span class="place-time pixel-font">${place.time}</span>
          ${place.mapUrl ? `
            <a class="place-name-link" href="${place.mapUrl}" target="_blank" rel="noopener noreferrer">
              <span class="place-name-text">📍 ${place.name}</span>
              <span class="place-name-hint pixel-font">지도보기 ›</span>
            </a>
          ` : `
            <div class="place-name-static">
              <span class="place-name-text">📍 ${place.name}</span>
            </div>
          `}
          <p class="place-desc">${place.desc}</p>
        </div>
      `).join('')}
    </div>
  </section>
`).join('');

container.innerHTML = html;

/* 카드가 화면에 들어올 때 살짝 나타나는 효과 (과하지 않게, 한 번만) */
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.day-card').forEach(card => observer.observe(card));
} else {
  document.querySelectorAll('.day-card').forEach(card => card.classList.add('is-visible'));
}
